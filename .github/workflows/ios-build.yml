name: Build iPhone app
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iphone-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: '1'
      RCT_NEW_ARCH_ENABLED: '0'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: android-app/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache-dependency-path: account-engine/go.sum
      - name: Install JavaScript dependencies
        working-directory: android-app
        run: npm ci --legacy-peer-deps
      - name: Check shared application
        working-directory: android-app
        run: |
          npx tsc --noEmit
          npx jest src/core/accountLibrary src/pages/accountLibrary --runInBand
      - name: Check embedded runtime
        working-directory: account-engine
        run: go test ./...
      - name: Build iPhone and simulator engine libraries
        working-directory: android-app
        run: bash scripts/build-account-engine-ios.sh
      - name: Install iOS dependencies
        working-directory: android-app/ios
        run: pod install --repo-update
      - name: Build simulator application
        shell: bash
        working-directory: android-app/ios
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/output/logs"
          xcodebuild -workspace MusicFree.xcworkspace -scheme MusicFree -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/heting-simulator" -jobs 2 \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build \
            | tee "$GITHUB_WORKSPACE/output/logs/simulator.log"
      - name: Archive unsigned iPhone application
        shell: bash
        working-directory: android-app/ios
        run: |
          set -o pipefail
          xcodebuild -workspace MusicFree.xcworkspace -scheme MusicFree -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Heting.xcarchive" -jobs 2 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO COMPILER_INDEX_STORE_ENABLE=NO archive \
            | tee "$GITHUB_WORKSPACE/output/logs/iphone.log"
      - name: Package unsigned application and simulator app
        shell: bash
        run: |
          mkdir -p output/Payload
          cp -R "$RUNNER_TEMP/Heting.xcarchive/Products/Applications/MusicFree.app" output/Payload/
          (cd output && zip -qry Heting-0.7.1-unsigned.ipa Payload)
          ditto -c -k --keepParent "$RUNNER_TEMP/heting-simulator/Build/Products/Release-iphonesimulator/MusicFree.app" output/Heting-0.7.1-simulator.zip
          cp docs/iPhone安装与构建.md output/
          shasum -a 256 output/*.ipa output/*simulator.zip > output/SHA256.txt
          echo 'Unsigned iPhone archive built. It requires Apple signing before installation.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Heting-iPhone-0.7.1-unsigned
          path: |
            output/*.ipa
            output/*simulator.zip
            output/*.md
            output/SHA256.txt
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Heting-iPhone-build-logs
          path: output/logs/
          if-no-files-found: ignore
          retention-days: 7
